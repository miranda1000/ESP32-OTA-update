; ============================================================
;  PlatformIO — ESP32 OTA Blink
;
;  Environments
;  ────────────
;  esp32_usb   first-time USB flash (and re-flash if needed)
;  esp32_ota   wireless OTA re-upload
;
;  Hostname
;  ────────
;  OTA_HOSTNAME defaults to "esp32-blink" but should be unique
;  per board. Override it at build time with --build-flag, e.g.:
;
;    pio run -e esp32_usb -t upload \
;        --build-flag='-DOTA_HOSTNAME=\"esp32-blink-1\"'
;
;  The Python helper does this automatically when you pass --hostname:
;
;    python esp32_ota.py flash --port /dev/ttyUSB0 --hostname esp32-blink-1
;    python esp32_ota.py upload --hostname esp32-blink-1
; ============================================================

[common]
platform      = espressif32
board         = esp32dev       ; adjust for your board (lolin32, nodemcu-32s …)
framework     = arduino
monitor_speed = 115200

[env:esp32_usb]
extends = common

[env:esp32_ota]
extends         = common
upload_protocol = espota
; upload_port and --build-flag are injected at runtime by esp32_ota.py
; or manually:
;   pio run -e esp32_ota -t upload --upload-port 192.168.1.42
